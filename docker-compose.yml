services:
  amandita-db:
    container_name: amandita-db
    image: amandita-db:latest   
    build:                      
      context: db            
    environment:
      POSTGRES_USER: amandita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: amandita
      PGDATA: /data/postgres
    volumes:
      - amandita-db:/data/postgres
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - amandita-network
    restart: unless-stopped

  amandita-api:
    container_name: amandita-api
    image: amandita-api:latest
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://amandita-db:5432/amandita
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      LOCAL_DELIVERY_GEOCODER_URL: ${LOCAL_DELIVERY_GEOCODER_URL:-https://cep.awesomeapi.com.br/json}
      LOCAL_DELIVERY_FALLBACK_GEOCODER_URL: ${LOCAL_DELIVERY_FALLBACK_GEOCODER_URL:-https://brasilapi.com.br/api/cep/v2}
      SAAS_BASE_DOMAIN: ${SAAS_BASE_DOMAIN:-mostradigital.com.br}
      SAAS_ADMIN_URL: ${SAAS_ADMIN_URL:-http://localhost:4173}
      APP_PUBLIC_API_URL: ${APP_PUBLIC_API_URL:-http://localhost:8080}
      AWS_S3_MOCK: ${AWS_S3_MOCK:-true}
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    networks:
      - amandita-network
    depends_on:
      - amandita-db
    restart: unless-stopped
    volumes:
      - ~/.amigoscode/s3:/root/.amigoscode/s3

  amandita-webhook-proxy:
    image: nginx:1.27-alpine
    container_name: amandita-webhook-proxy
    volumes:
      - ./docker/nginx/webhook.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - amandita-network
    depends_on:
      - amandita-api
    restart: unless-stopped

  amandita-ngrok:
    image: ngrok/ngrok:latest
    container_name: amandita-ngrok
    command: http amandita-webhook-proxy:80 --log stdout
    env_file:
      - path: .env
        required: false
    networks:
      - amandita-network
    depends_on:
      - amandita-webhook-proxy
    restart: unless-stopped

  amandita-admin:
    container_name: amandita-admin
    image: amandita-admin:latest
    build:
      context: admin
      dockerfile: Dockerfile
      args:
        api_build_url: http://amandita-api:8080
        api_runtime_url: ${APP_PUBLIC_API_URL:-http://localhost:8080}
        google_client_id: ${GOOGLE_CLIENT_ID}
        portal_url: ${PORTAL_PUBLIC_URL:-http://localhost:5174}
    ports:
      - "4173:4173"
    networks:
      - amandita-network
    depends_on:
      - amandita-api
    restart: unless-stopped

  amandita-frontend:
    container_name: amandita-frontend
    image: amandita-frontend:latest
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        api_build_url: http://amandita-api:8080/api/v1
        api_runtime_url: ${APP_PUBLIC_API_V1_URL:-http://localhost:8080/api/v1}
        google_client_id: ${GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    networks:
      - amandita-network
    depends_on:
      - amandita-api
    restart: unless-stopped

  amandita-portal:
    container_name: amandita-portal
    image: amandita-portal:latest
    build:
      context: portal
      dockerfile: Dockerfile
      args:
        api_url: ${APP_PUBLIC_API_V1_URL:-http://localhost:8080/api/v1}
        base_domain: ${SAAS_BASE_DOMAIN:-mostradigital.com.br}
        admin_url: ${SAAS_ADMIN_URL:-http://localhost:4173}
        google_client_id: ${GOOGLE_CLIENT_ID}
        google_analytics_id: ${GOOGLE_ANALYTICS_ID:-}
        posthog_project_key: ${POSTHOG_PROJECT_KEY:-}
        posthog_host: ${POSTHOG_HOST:-https://us.i.posthog.com}
    ports:
      - "5174:5174"
    networks:
      - amandita-network
    depends_on:
      - amandita-api
    restart: unless-stopped

networks:
  amandita-network:
    driver: bridge

volumes:
  amandita-db:
