name: Verify and deploy staging

on:
  push:
    branches:
      - main
      - mega-pr-mvp-safety-pass
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: mvn -B -f backend/pom.xml test

  frontends:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admin
            node: "18"
          - app: storefront
            directory: frontend
            node: "20"
          - app: portal
            node: "22"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.directory || matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.directory || matrix.app }}
        run: npm ci

      - name: Audit portal dependencies
        if: matrix.app == 'portal'
        working-directory: portal
        run: npm audit --audit-level=low

      - name: Build application
        working-directory: ${{ matrix.directory || matrix.app }}
        run: npm run build

  deploy-staging:
    name: Deploy staging to VPS
    needs:
      - backend
      - frontends
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.STAGING_DEPLOY_ENABLED == 'true' }}
    concurrency:
      group: kizi-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment settings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_APP_DIR VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub staging secret: $name"
              exit 1
            fi
          done
          if [[ ! "$VPS_APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "VPS_APP_DIR must be an absolute path using only letters, numbers, '.', '_', '/', and '-'."
            exit 1
          fi

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/kizi_staging"
          chmod 600 "$HOME/.ssh/kizi_staging"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package this commit
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/kizi-staging.tar.gz" "$GITHUB_SHA"

      - name: Upload source and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          remote_archive="/tmp/kizi-staging-${GITHUB_SHA}.tar.gz"
          scp -i "$HOME/.ssh/kizi_staging" -P "$VPS_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/kizi-staging.tar.gz" "$VPS_USER@$VPS_HOST:$remote_archive"
          ssh -i "$HOME/.ssh/kizi_staging" -p "$VPS_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$VPS_APP_DIR' '$remote_archive' '$GITHUB_SHA'" \
            < ops/deploy-staging.sh
