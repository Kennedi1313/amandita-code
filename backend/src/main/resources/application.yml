server:
  port: 8080
  error:
    include-message: always
  ssl:
    key-store-type: PKCS12
    key-store: classpath:keystore/amandita.p12
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-alias: amandita
    enabled: false

cors:
  allowed-origins: "*"
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "*"

aws:
  region: sa-east-1
  s3:
    mock: ${AWS_S3_MOCK:false}
    buckets:
      customer: amandita-uploads
      product: amandita-products-uploads

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}

jwt:
  secret: ${JWT_SECRET}

asaas:
  base-url: ${ASAAS_BASE_URL:https://api.asaas.com/v3}
  api-key: ${ASAAS_API_KEY:}
  webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
  return-base-url: ${ASAAS_RETURN_BASE_URL:}

saas:
  base-domain: ${SAAS_BASE_DOMAIN:mostradigital.com.br}
  admin-url: ${SAAS_ADMIN_URL:https://admin.mostradigital.com.br}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/amandita
    username: amandita
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 2
    locations: classpath:db/migration
  main:
    web-application-type: servlet
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  codec:
    max-in-memory-size: 10MB
